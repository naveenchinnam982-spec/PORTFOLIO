[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/track-social-click"
  to = "/.netlify/functions/track-social-click"
  status = 200

[[redirects]]
  from = "/api/track-interaction"
  to = "/.netlify/functions/track-social-click"
  status = 200

[[redirects]]
  from = "/api/auth/google"
  to = "/.netlify/functions/auth-google"
  status = 200

[[redirects]]
  from = "/api/auth/manage"
  to = "/.netlify/functions/auth-manage"
  status = 200

[[redirects]]
  from = "/api/admin/analytics"
  to = "/.netlify/functions/admin-analytics"
  status = 200

[[redirects]]
  from = "/api/track-visitor"
  to = "/.netlify/functions/track-visitor"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
